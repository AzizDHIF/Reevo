description: Solving Multi-Objective Multiple Knapsack Problems (MO-MKP) through stochastic solution sampling based on "heuristics". MO-MKP involves selecting a subset of items to simultaneously optimize multiple conflicting objectives (e.g., maximizing total prize and minimizing total weight), subject to multi-dimensional capacity constraints across multiple knapsacks.