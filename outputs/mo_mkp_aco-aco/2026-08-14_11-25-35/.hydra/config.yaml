algorithm: reevo
max_fe: 100
pop_size: 4
init_pop_size: 4
mutation_rate: 0.5
timeout: 200
diversify_init_pop: true
problem:
  problem_name: mo_mkp_aco
  problem_type: aco
  obj_type: max
  problem_size: 100
  func_name: heuristic
  description: Solving Multi-Objective Multiple Knapsack Problems (MO-MKP) through
    stochastic solution sampling based on "heuristics". MO-MKP involves selecting
    a subset of items to simultaneously optimize multiple conflicting objectives (e.g.,
    maximizing total prize and minimizing total weight), subject to multi-dimensional
    capacity constraints across multiple knapsacks.
llm_client:
  _target_: utils.llm_client.llama_api.LlamaAPIClient
  model: llama-3.3-70b-versatile
  temperature: 1.0
  api_key: ${oc.env:GROQ_API_KEY,null}
  base_url: https://api.groq.com/openai/v1
